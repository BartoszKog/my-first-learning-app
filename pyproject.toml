[project]
name = "learning-app"
version = "1.0.8"
description = "Word learning application built with Flet"
requires-python = ">=3.12, <3.14"
dependencies = [
    "flet>=1.1.0",
    "flet-audio>=1.1.0",
    "gTTS>=2.5.0",
    "pandas==3.0.3",
    # Pinned to wheels published for Flet mobile builds. Newer pydantic
    # asks for a pydantic-core wheel that pypi.flet.dev does not ship.
    "sqlmodel==0.0.48",
    "SQLAlchemy==2.0.50",
    "greenlet==3.5.1",
    "pydantic==2.11.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learning_app"]

[dependency-groups]
dev = [
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]",
    "ruff>=0.15.21",
    "flet[test]",
    "flet-cli",
    "flet-desktop",
]

[tool.flet]
build_number = 9

[tool.flet.app]
path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--import-mode=importlib"]
